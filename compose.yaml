name: ultrastonk

x-flink: &flink
  image: ultrastonk-flink:local
  build:
    context: .
    dockerfile: flink/Dockerfile
  environment: &flink-env
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-price-events}
    KAFKA_OUTPUT_TOPIC: ${KAFKA_OUTPUT_TOPIC:-events-processed}
    KAFKA_REJECTED_TOPIC: ${KAFKA_REJECTED_TOPIC:-price-events-rejected}
    KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-ultrastonk-flink}
    KAFKA_TRANSACTION_PREFIX: ${KAFKA_TRANSACTION_PREFIX:-ultrastonk-}
    FLINK_PARALLELISM: ${FLINK_PARALLELISM:-2}
    WINDOW_SIZE_MS: ${WINDOW_SIZE_MS:-300000}
    MAX_OUT_OF_ORDER_MS: ${MAX_OUT_OF_ORDER_MS:-5000}
    SOURCE_IDLE_TIMEOUT_MS: ${SOURCE_IDLE_TIMEOUT_MS:-30000}
    CHECKPOINT_INTERVAL_MS: ${CHECKPOINT_INTERVAL_MS:-10000}
    DEDUP_STRATEGY: ${DEDUP_STRATEGY:-NONE}
    DEDUP_TTL_MS: ${DEDUP_TTL_MS:-3600000}
    LATE_EVENT_STRATEGY: ${LATE_EVENT_STRATEGY:-DROP}
    ALLOWED_LATENESS_MS: ${ALLOWED_LATENESS_MS:-30000}
    LOG_INTERVAL_MS: ${LOG_INTERVAL_MS:-10000}
    ENABLE_BUILT_IN_PLUGINS: ${FLINK_FILESYSTEM_PLUGINS:-}
    PROFILE_ENABLED: ${PROFILE_ENABLED:-true}
    PROFILE_SAMPLE_EVERY: ${PROFILE_SAMPLE_EVERY:-100}
    PROFILE_ISOLATE_OPERATORS: ${PROFILE_ISOLATE_OPERATORS:-false}
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.bind-address: 0.0.0.0
      taskmanager.numberOfTaskSlots: 1
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 1536m
      state.checkpoints.dir: ${FLINK_CHECKPOINTS_URI:-file:///opt/flink/state/checkpoints}
      state.savepoints.dir: ${FLINK_SAVEPOINTS_URI:-file:///opt/flink/state/savepoints}
      state.backend.type: rocksdb
      state.backend.incremental: true
      metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      metrics.reporter.prom.port: 9249
      metrics.latency.interval: 5000
      metrics.latency.granularity: operator
      metrics.system-resource: true
  volumes:
    - flink-state:/opt/flink/state
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-price-events}
      OUTPUT_TOPIC: ${KAFKA_OUTPUT_TOPIC:-events-processed}
      REJECTED_TOPIC: ${KAFKA_REJECTED_TOPIC:-price-events-rejected}
      PARTITIONS: ${KAFKA_PARTITIONS:-6}
      REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      MIN_ISR: ${KAFKA_MIN_ISR:-1}
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        for topic in "$$INPUT_TOPIC" "$$OUTPUT_TOPIC" "$$REJECTED_TOPIC"; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions "$$PARTITIONS" --replication-factor "$$REPLICATION_FACTOR" \
            --config min.insync.replicas="$$MIN_ISR" \
            --config retention.ms=604800000
        done

  jobmanager:
    <<: *flink
    # Without JobManager HA, a container restart would start another replay from old offsets.
    restart: "no"
    command: [standalone-job, --job-classname, fi.ultrastonk.PricePipeline]
    environment:
      <<: *flink-env
      FLINK_RESTORE_PATH: ${FLINK_RESTORE_PATH:-}
      FLINK_BOUNDED_REPLAY: ${FLINK_BOUNDED_REPLAY:-false}
    ports:
      - "127.0.0.1:${FLINK_UI_PORT:-8081}:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  taskmanager:
    <<: *flink
    command: [taskmanager]
    depends_on:
      - jobmanager
    deploy:
      replicas: 2

  benchmark:
    profiles: [benchmark]
    build:
      context: ./benchmarks
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-price-events}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_OUTPUT_TOPIC:-events-processed}
      KAFKA_REJECTED_TOPIC: ${KAFKA_REJECTED_TOPIC:-price-events-rejected}
      DEDUP_STRATEGY: ${DEDUP_STRATEGY:-NONE}
      LATE_EVENT_STRATEGY: ${LATE_EVENT_STRATEGY:-DROP}
      WINDOW_SIZE_MS: ${WINDOW_SIZE_MS:-300000}
      MAX_OUT_OF_ORDER_MS: ${MAX_OUT_OF_ORDER_MS:-5000}
      SOURCE_IDLE_TIMEOUT_MS: ${SOURCE_IDLE_TIMEOUT_MS:-30000}
      ALLOWED_LATENESS_MS: ${ALLOWED_LATENESS_MS:-30000}
      FLINK_PARALLELISM: ${FLINK_PARALLELISM:-2}
      CHECKPOINT_INTERVAL_MS: ${CHECKPOINT_INTERVAL_MS:-10000}
      PROFILE_ENABLED: ${PROFILE_ENABLED:-true}
      PROFILE_SAMPLE_EVERY: ${PROFILE_SAMPLE_EVERY:-100}
      PROFILE_ISOLATE_OPERATORS: ${PROFILE_ISOLATE_OPERATORS:-false}
    volumes:
      - ./benchmarks/results:/results

  event-emitter:
    profiles: [emitter]
    build:
      context: ./event-emitter
    environment:
      KAFKA_SERVER: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      TOPIC_NAME: ${KAFKA_INPUT_TOPIC:-price-events}
      CSV_PATH: ${CSV_PATH:-/data/src/debs2022-gc-trading-day-12-11-21.csv}
      SPEED_MULTIPLIER: ${SPEED_MULTIPLIER:-1.0}
      MAX_SLEEP_MS: ${MAX_SLEEP_MS:-0}
      EVENT_TIME_ZONE: ${EVENT_TIME_ZONE:-Europe/Berlin}
      # Keep historical event time in the payload, not in Kafka's retention clock.
      RECORD_TIMESTAMP: append
    volumes:
      - type: bind
        source: ${REPLAY_DATA_DIR:-./data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  dummy-emitter:
    profiles: [synthetic]
    build:
      context: ./benchmarks/synthetic-emitter
    command: [--config, /config/default.json]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:-price-events}
    volumes:
      - ./benchmarks/synthetic-emitter/configs:/config:ro
    ports:
      - "127.0.0.1:${EMITTER_METRICS_PORT:-8001}:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    stop_grace_period: 30s

volumes:
  kafka-data:
  flink-state:
