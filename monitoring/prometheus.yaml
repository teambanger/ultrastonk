global:
  scrape_interval: 5s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/profiling-rules.yaml
scrape_configs:
  - job_name: flink-jobmanager
    static_configs:
      - targets: [jobmanager:9249]
  - job_name: flink-taskmanagers
    dns_sd_configs:
      - names: [taskmanager]
        type: A
        port: 9249
        refresh_interval: 10s
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: dummy-emitter
    dns_sd_configs:
      - names: [dummy-emitter]
        type: A
        port: 8000
        refresh_interval: 10s
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: resources
    static_configs:
      - targets: [resource-exporter:8000]
