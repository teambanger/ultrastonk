# Overlay: three replicated Kafka brokers/controllers. Flink workers remain independently scalable.
x-kafka-env: &kafka-cluster-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

x-kafka-node: &kafka-cluster-node
  image: apache/kafka:3.9.1
  healthcheck:
    test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s
  restart: unless-stopped

services:
  kafka:
    environment:
      <<: *kafka-cluster-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}

  kafka-2:
    <<: *kafka-cluster-node
    ports:
      - "127.0.0.1:${KAFKA_PORT_2:-9094}:29092"
    environment:
      <<: *kafka-cluster-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT_2:-9094}
    volumes:
      - kafka-data-2:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-cluster-node
    ports:
      - "127.0.0.1:${KAFKA_PORT_3:-9096}:29092"
    environment:
      <<: *kafka-cluster-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT_3:-9096}
    volumes:
      - kafka-data-3:/var/lib/kafka/data

  kafka-init:
    environment:
      REPLICATION_FACTOR: 3
      MIN_ISR: 2
    depends_on:
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  jobmanager:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092

  taskmanager:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092

  benchmark:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092

  dummy-emitter:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092

volumes:
  kafka-data-2:
  kafka-data-3:
