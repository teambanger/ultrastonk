services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=14d]
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - ./monitoring/profiling-rules.yaml:/etc/prometheus/profiling-rules.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: [--kafka.server=kafka:9092, --kafka.version=3.9.0, --group.filter=.*, --topic.filter=.*]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  resource-exporter:
    build:
      context: ./monitoring/resource-exporter
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-ultrastonk}
      RESOURCE_SAMPLE_INTERVAL_SECONDS: ${RESOURCE_SAMPLE_INTERVAL_SECONDS:-5}
      EXPECTED_TASKMANAGERS: ${EXPECTED_TASKMANAGERS:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    command: [-config.file=/etc/loki/local-config.yaml, -config.expand-env=true]
    environment:
      LOKI_WAL_DISK_FULL_THRESHOLD: ${LOKI_WAL_DISK_FULL_THRESHOLD:-0.9}
    volumes:
      - ./monitoring/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.13.0
    command: [run, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-ultrastonk}
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ultrastonk-local}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
