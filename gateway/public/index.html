<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway Test Page</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#6b7280; --line:#e5e7eb; --card:#f8fafc;
          --price:#2563eb; --e38:#d97706; --e100:#7c3aed; --buy:#16a34a; --sell:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af; --line:#2a2f37; --card:#171a20;
            --price:#60a5fa; --e38:#fbbf24; --e100:#a78bfa; --buy:#4ade80; --sell:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:18px; margin:0 0 12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  input { flex:1 1 260px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
  #status { font-weight:600; } .ok { color:var(--buy); } .bad { color:var(--sell); }
  table { width:100%; border-collapse:collapse; margin-bottom:12px; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:4px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  tr.sel { background:var(--card); } tbody tr { cursor:pointer; }
  .BUY { color:var(--buy); font-weight:600; } .SELL { color:var(--sell); font-weight:600; }
  .wrap { overflow-x:auto; }
  canvas { width:100%; height:260px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  .legend span { margin-right:12px; } .muted { color:var(--muted); }
  #log { height:180px; overflow:auto; font:12px/1.4 ui-monospace, monospace; background:var(--card);
         border:1px solid var(--line); border-radius:6px; padding:6px; white-space:pre; }
</style>
</head>
<body>
<h1>Ultrastonk gateway: test client</h1>
<div class="row">
  <span>WebSocket: <span id="status" class="bad">connecting…</span></span>
  <span class="muted" id="url"></span>
</div>
<div class="row">
  <input id="tickers" value="A2ASZ7.ETR, RDSA.NL" aria-label="Tickers, comma separated">
  <button id="sub">Subscribe</button>
  <button id="unsub">Unsubscribe</button>
</div>

<div class="wrap">
<table>
  <thead><tr><th>Ticker</th><th>price</th><th>EMA38</th><th>EMA100</th><th>Last signal</th><th>Event age (ms)</th><th>Events</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>

<div class="legend row">
  <b id="chartTitle">Click a row to chart it</b>
  <span style="color:var(--price)">■ price</span><span style="color:var(--e38)">■ EMA38</span>
  <span style="color:var(--e100)">■ EMA100</span><span style="color:var(--buy)">▲ BUY</span><span style="color:var(--sell)">▼ SELL</span>
</div>
<canvas id="chart"></canvas>

<p class="muted">Raw messages (newest first):</p>
<div id="log"></div>

<script>
'use strict';
const MAX_POINTS = 500;
const params = new URLSearchParams(location.search);
const WS_URL = params.get('ws') || `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host || 'localhost:8080'}/`;
document.getElementById('url').textContent = WS_URL;

const data = new Map();      // ticker -> { series: {type: [{t,v}]}, last: {type: v}, signal, latency, count }
const subscribed = new Set();
let selected = null;
let ws;

const $ = (id) => document.getElementById(id);
const parseTickers = () => $('tickers').value.split(',').map((s) => s.trim()).filter((s) => /^[A-Za-z0-9._-]{1,32}$/.test(s));

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    $('status').textContent = 'connected'; $('status').className = 'ok';
    if (subscribed.size) send({ type: 'subscribe', tickers: [...subscribed] }); // resubscribe after reconnect
  };
  ws.onclose = () => {
    $('status').textContent = 'disconnected, retrying…'; $('status').className = 'bad';
    setTimeout(connect, 2000);
  };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    log(m.data);
    if (msg.type === 'history' && Array.isArray(msg.events)) {
      const d = entry(msg.ticker);
      d.series = Object.create(null); d.count = 0;
      for (const e of msg.events) addEvent(e, false);
    } else if (msg.type === 'error' && !msg.ticker) {
      // shown in the log only
    } else if (msg.ticker) {
      addEvent(msg, true);
    }
    scheduleRender();
  };
}

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function entry(ticker) {
  if (!data.has(ticker)) data.set(ticker, { series: Object.create(null), last: Object.create(null), signal: null, latency: null, count: 0 });
  return data.get(ticker);
}

function addEvent(e, live) {
  const d = entry(e.ticker);
  // Signals may come without a value: draw them at the last known price.
  const v = typeof e.value === 'number' ? e.value : d.last.price;
  if (typeof v === 'number') {
    const s = (d.series[e.type] ||= []);
    s.push({ t: e.timestamp_emit, v });
    if (s.length > MAX_POINTS) s.shift();
  }
  if (typeof e.value === 'number') d.last[e.type] = e.value;
  d.count++;
  if (e.type === 'BUY' || e.type === 'SELL') d.signal = { type: e.type, t: e.timestamp_emit };
  if (live) d.latency = Date.now() - e.timestamp_emit;
  if (!selected) selected = e.ticker;
}

function log(text) {
  const el = $('log');
  el.textContent = text + '\n' + el.textContent.split('\n').slice(0, 99).join('\n');
}

let pending = false;
function scheduleRender() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }

const fmt = (v) => (v === undefined ? '–' : Number(v).toFixed(4));
function render() {
  const rows = [...data.entries()].filter(([t]) => subscribed.has(t)).map(([t, d]) => {
    const sig = d.signal ? `<span class="${d.signal.type}">${d.signal.type}</span> ${new Date(d.signal.t).toLocaleTimeString()}` : '–';
    return `<tr data-t="${t}" class="${t === selected ? 'sel' : ''}"><td>${t}</td><td>${fmt(d.last.price)}</td>`
      + `<td>${fmt(d.last.EMA38)}</td><td>${fmt(d.last.EMA100)}</td><td>${sig}</td>`
      + `<td>${d.latency ?? '–'}</td><td>${d.count}</td></tr>`;
  });
  $('rows').innerHTML = rows.join('');
  drawChart();
}

function drawChart() {
  const c = $('chart');
  const dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const W = c.clientWidth, H = c.clientHeight, P = 30;
  const d = selected && data.get(selected);
  $('chartTitle').textContent = d ? selected : 'Click a row to chart it';
  if (!d) return;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n);
  const lines = [['price', '--price'], ['EMA38', '--e38'], ['EMA100', '--e100']];
  const pts = Object.values(d.series).flat();
  if (!pts.length) return;
  const t0 = Math.min(...pts.map((p) => p.t)), t1 = Math.max(...pts.map((p) => p.t));
  const v0 = Math.min(...pts.map((p) => p.v)), v1 = Math.max(...pts.map((p) => p.v));
  const x = (t) => P + ((t - t0) / Math.max(t1 - t0, 1)) * (W - 2 * P);
  const y = (v) => H - P - ((v - v0) / Math.max(v1 - v0, 1e-9)) * (H - 2 * P);
  g.fillStyle = css('--muted'); g.font = '11px system-ui';
  g.fillText(v1.toFixed(2), 2, P - 4); g.fillText(v0.toFixed(2), 2, H - P + 12);
  for (const [type, color] of lines) {
    const s = d.series[type]; if (!s || s.length < 2) continue;
    g.strokeStyle = css(color); g.lineWidth = type === 'price' ? 1 : 2; g.beginPath();
    s.forEach((p, i) => (i ? g.lineTo(x(p.t), y(p.v)) : g.moveTo(x(p.t), y(p.v))));
    g.stroke();
  }
  for (const [type, color, dir] of [['BUY', '--buy', -1], ['SELL', '--sell', 1]]) {
    g.fillStyle = css(color);
    for (const p of d.series[type] || []) {
      const px = x(p.t), py = y(p.v) - dir * 10;
      g.beginPath(); g.moveTo(px, py + dir * 6); g.lineTo(px - 6, py - dir * 6); g.lineTo(px + 6, py - dir * 6); g.fill();
    }
  }
}

$('sub').onclick = () => { const t = parseTickers(); t.forEach((x) => subscribed.add(x)); send({ type: 'subscribe', tickers: t }); render(); };
$('unsub').onclick = () => {
  const t = parseTickers(); t.forEach((x) => { subscribed.delete(x); data.delete(x); });
  if (!data.has(selected)) selected = null;
  send({ type: 'unsubscribe', tickers: t }); render();
};
$('rows').onclick = (ev) => { const tr = ev.target.closest('tr'); if (tr) { selected = tr.dataset.t; render(); } };
window.addEventListener('resize', scheduleRender);
connect();
</script>
</body>
</html>
